<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SriCraftsEcoShop</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fef9f3;color:#5a3d2b}
header{background:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 5px #eee;position:sticky;top:0;z-index:10}
.logo{font-weight:bold;font-size:20px}.logo span{color:#e67e22}
.btns{display:flex;gap:6px;background:#f5ebe0;border-radius:20px;padding:4px}
.btns button{border:none;padding:6px 12px;border-radius:20px;font-weight:bold;cursor:pointer}
.active{background:#5a3d2b;color:white}
.hero{padding:30px 16px;background:linear-gradient(90deg,#fef9f3,#fdebd0);text-align:center}
.hero h1{font-size:28px;line-height:1.2}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #eee}
.card img{width:100%;height:160px;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.price{color:#e67e22;font-weight:bold}
.buy{width:100%;background:#fef3e2;border:none;padding:8px;border-radius:20px;margin-top:6px;font-weight:bold;color:#5a3d2b}
footer{background:#5a3d2b;color:#f5ebe0;text-align:center;padding:20px;margin-top:20px;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">🌿 SriCrafts<span>EcoShop</span></div>
<div class="btns"><button id="b1" class="active" onclick="lang('en')">EN</button><button id="b2" onclick="lang('ta')">தமிழ்</button></div>
</header>

<div class="hero">
<h1 id="h1">Handmade Crafts,<br>Made with <span style="color:#e67e22">Love</span></h1>
<p id="p1">Eco-friendly products from Tamil Nadu artisans</p>
</div>

<h2 id="t1" style="padding:0 16px">Our Eco Collection</h2>
<div class="grid" id="grid"></div>

<footer>© 2026 SriCraftsEcoShop - Sridevika K | Tirupur<br>Live: kannansridevika.github.io/sri/</footer>

<script>
const P=[
{nameE:"Jute Handbag",nameT:"சணல் கைப்பை",pr:599,im:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400"},
{nameE:"Terracotta Pot",nameT:"மண் பானை",pr:299,im:"https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=400"},
{nameE:"Bamboo Basket",nameT:"மூங்கில் கூடை",pr:450,im:"https://images.unsplash.com/photo-1618220179428-22790b461013?w=400"},
{nameE:"Handloom Saree",nameT:"கைத்தறி சேலை",pr:1299,im:"https://images.unsplash.com/photo-1610030469983-98e550d6193a?w=400"},
{nameE:"Wooden Toys",nameT:"மர பொம்மைகள்",pr:350,im:"https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=400"},
{nameE:"Palm Leaf Box",nameT:"பனை ஓலை பெட்டி",pr:199,im:"https://images.unsplash.com/photo-1607613009820-a29f7bb81c04?w=400"},
{nameE:"Coir Doormat",nameT:"தென்னை நார் பாய்",pr:250,im:"https://images.unsplash.com/photo-1584305574647-0cc949a2bb9f?w=400"},
{nameE:"Banana Fiber Purse",nameT:"வாழை நார் பர்ஸ்",pr:399,im:"https://images.unsplash.com/photo-1591561954557-26941169b49e?w=400"}
];
let L="en";
function lang(l){
L=l;
document.getElementById("b1").className=l=="en"?"active":"";
document.getElementById("b2").className=l=="ta"?"active":"";
document.getElementById("t1").innerText=l=="en"?"Our Eco Collection":"எங்கள் சூழல் சேகரிப்பு";
document.getElementById("h1").innerHTML=l=="en"?"Handmade Crafts,<br>Made with <span style='color:#e67e22'>Love</span>":"கையால் செய்யப்பட்ட<br><span style='color:#e67e22'>அன்புடன்</span> கைவினை";
document.getElementById("p1").innerText=l=="en"?"Eco-friendly products from Tamil Nadu artisans":"தமிழ்நாடு கைவினைஞர்களின் தயாரிப்புகள்";
draw();
}
function draw(){
let h="";
for(let i=0;i<P.length;i++){
let n=L=="en"?P[i].nameE:P[i].nameT;
let b=L=="en"?"Add to Cart":"கூடைக்கு சேர்";
h+='<div class="card"><img src="'+P[i].im+'"><div style="padding:10px"><div style="font-weight:bold;font-size:14px">'+n+'</div><div class="price">₹'+P[i].pr+'</div><button class="buy">'+b+'</button></div></div>';
}
document.getElementById("grid").innerHTML=h;
}
draw();
</script>
</body>
</html>
